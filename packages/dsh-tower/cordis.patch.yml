# dsh-tower bundle layer.
#
# Inserts one Cordis plugin row into the profile. The loader resolves the row's
# `name` (this package) and mounts its module, which named-exports
# { name, inject, apply } and registers five tools on the harness tool registry
# (ctx.tools): tower_dispatch, tower_inbox, tower_accept, tower_rework, tower_status.
#
# Install into a profile:
#   dsh plugin --profile <name> add dsh-tower                       # published
#   dsh plugin --profile <name> add ./packages/dsh-tower            # local checkout
#
# Optional config (set in the profile's cordis.patch.yml as a later layer
# targeting this row's id):
#   workspace: /abs/project   # directory containing tower.toml (default: cwd)
#   towerBin: tower           # CLI command (default: "tower")
#   python: python            # used as "<python> -m control_tower" when towerBin is empty
#   timeoutMs: 1800000        # per-tool dispatch timeout (default: 30 min)
- insert:
    - id: tower
      name: dsh-tower
